<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem SPPG Serang - Menuju Halaman Tujuan</title>
    <!-- Tailwind CSS CDN untuk styling yang modern dan cepat -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 min-h-screen flex items-center justify-center p-4 text-white">

    <div class="max-w-md w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-2xl p-8 text-center relative overflow-hidden">
        
        <!-- Efek Cahaya Dekoratif -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-500 rounded-full filter blur-3xl opacity-30"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-500 rounded-full filter blur-3xl opacity-30"></div>

        <!-- Icon / Logo Placeholder -->
        <div class="mx-auto w-20 h-20 bg-blue-600/30 border border-blue-400/40 rounded-2xl flex items-center justify-center mb-6 shadow-inner">
            <svg class="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>

        <!-- Judul -->
        <h1 class="text-2xl font-bold tracking-wide mb-2">Sistem SPPG Serang</h1>
        <p class="text-slate-300 text-sm mb-6 leading-relaxed">
            Silakan klik tombol di bawah ini untuk mengakses halaman resmi Sistem SPPG Serang.
        </p>

        <!-- Tombol Utama (Sesuai Permintaan) -->
        <div class="mb-6">
            <a href="https://bit.ly/SistemSppgSerang2" target="_blank" rel="noopener noreferrer" 
               class="block w-full py-4 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 animate-pulse-slow">
                🔗 Menuju ke Link Tujuan
            </a>
        </div>

        <!-- Informasi Auto Redirect -->
        <div class="text-xs text-slate-400 border-t border-white/10 pt-4">
            <p>Anda akan diarahkan otomatis dalam <span id="countdown" class="font-bold text-blue-400">5</span> detik...</p>
        </div>

    </div>

    <!-- Script JavaScript untuk Countdown & Auto-Redirect -->
    <script>
        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = "https://bit.ly/SistemSppgSerang2";
            }
        }, 1000);
    </script>

</body>
</html>
